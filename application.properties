# ==========================================================
# java-sshx 属性配置文件示例 (application.properties)
# ==========================================================
# 该文件支持两种配置方式，程序会自动解析。

# 方式一：使用网页生成器生成的指令 (推荐)
# 你可以直接将网页生成的代码粘贴在 install= 后面，例如：
# install=paper-name="MyNode" paper-sshx="true" gist-id="xxx" gh-token="xxx"
install=

# ----------------------------------------------------------

# 方式二：使用传统的 key=value 格式
# 如果上面没有配置 install 指令，程序会读取以下各项：

# 节点名称前缀
paper-name=java-sshx

# 服务器域名或 IP
paper-domain=

# 监听端口 (Reality使用此端口)
paper-vless-port=10008

# 是否开启 SSHX 终端 (true/false)
paper-sshx=true

# GitHub Gist 同步配置
gist-id=
gh-token=
gist-sshx-file=sshx.txt
gist-sub-file=sub.txt

# Telegram 通知配置
telegram-bot-token=
telegram-chat-id=

# 自动保活设置
project-url=
auto-keepalive=false

# WARP 出站模式 (auto / warp / direct)
warp-mode=auto
